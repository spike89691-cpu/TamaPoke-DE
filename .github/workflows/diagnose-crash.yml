name: TamaPoke Absturzdiagnose

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: ESP32-S3-Firmware kompilieren
    runs-on: ubuntu-22.04
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Arduino CLI installieren
        uses: arduino/setup-arduino-cli@v2

      - name: ESP32-S3-Boardpaket und Bibliotheken installieren
        shell: bash
        run: |
          set -euo pipefail
          URL=https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls "$URL"
          arduino-cli core list | grep -F "3.3.11"
          arduino-cli lib update-index
          arduino-cli lib install "GFX Library for Arduino"
          arduino-cli lib install "SensorLib@0.4.1"
          arduino-cli lib install "XPowersLib"

      - name: Deutsche Namen und JS-Sicherungen prüfen
        run: |
          python3 tools/check_german_names.py
          node tools/check_savefile.mjs
          g++ -std=c++17 -O1 -Itools/emu -I. tools/emu/tests/german_names_test.cpp i18n.cpp tools/emu/nvsinfo_stub.cpp -o /tmp/test_german_names
          /tmp/test_german_names

      - name: Firmware kompilieren
        shell: bash
        run: |
          set -euo pipefail
          FQBN='esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,PSRAM=opi,PartitionScheme=app3M_fat9M_16MB'
          mkdir -p "$RUNNER_TEMP/esp32-build"
          arduino-cli compile --fqbn "$FQBN" --output-dir "$RUNNER_TEMP/esp32-build" .
          ls -lah "$RUNNER_TEMP/esp32-build"

      - name: Debug-Dateien sichern
        uses: actions/upload-artifact@v4
        with:
          name: TamaPoke-Debug-ELF
          path: |
            ${{ runner.temp }}/esp32-build/*.elf
            ${{ runner.temp }}/esp32-build/*.map
            ${{ runner.temp }}/esp32-build/*.bin
          if-no-files-found: error
          retention-days: 30

      - name: Crash-Backtrace in Quelldateien auflösen
        shell: bash
        run: |
          set -euo pipefail
          arduino-cli core list
          arduino-cli lib list
          mapfile -t ELFS < <(find "$RUNNER_TEMP/esp32-build" -maxdepth 1 -name '*.elf')
          test "${#ELFS[@]}" -eq 1
          ELF="${ELFS[0]}"
          HASH=$(sha256sum "$ELF" | cut -d ' ' -f 1)
          echo "ELF SHA256: $HASH"
          echo "Abgestürzter Build: 5d9b56284"
          if [[ "$HASH" != 5d9b56284* ]]; then
            echo "::warning::Die ELF stimmt nicht mit dem Absturz-Build überein. Alte Adressen sind mit diesem Build nicht zuverlässig auflösbar."
            exit 0
          fi
          ADDR2LINE=$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name '*esp32s3*addr2line' -print -quit)
          if [[ -z "$ADDR2LINE" ]]; then
            ADDR2LINE=$(find "$HOME/.arduino15/packages/esp32/tools" -type f -name 'xtensa-esp-elf-addr2line' -print -quit)
          fi
          test -n "$ADDR2LINE"
          "$ADDR2LINE" -pfiaC -e "$ELF" 0x420166f7 0x420120f1 0x4202bd86 0x4037f675 0x420215ce
